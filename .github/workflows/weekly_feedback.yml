name: Weekly Performance Feedback

on:
  schedule:
    - cron: "0 6 * * 1"     # her pazartesi 06:00 UTC (günlük üretim çalışmalarından önce)
  workflow_dispatch:

# Günlük üretimle ayrı kuyrukta çalışır: yalnızca data/learned.json değişir, history.json ile çakışmaz
concurrency:
  group: weekly-feedback
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-learned:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Herkese açık istatistikleri okumak için CH4 token'ı (yeni yetki gerekmez)
      YT_CH4_CLIENT_ID: ${{ secrets.YT_CH4_CLIENT_ID }}
      YT_CH4_CLIENT_SECRET: ${{ secrets.YT_CH4_CLIENT_SECRET }}
      YT_CH4_REFRESH_TOKEN: ${{ secrets.YT_CH4_REFRESH_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests python-dotenv

      - name: Update learned titles
        run: python scripts/update_learned.py

      - name: Commit learned titles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/learned.json
          if git diff --cached --quiet; then
            echo "learned.json değişmedi, commit atlanıyor."
          else
            git commit -m "chore: haftalık performans geri bildirimi [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
